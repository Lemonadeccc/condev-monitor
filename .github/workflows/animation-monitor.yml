name: Animation monitor

on:
    pull_request:
    push:
        branches: [develop, main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: animation-monitor-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    static:
        name: Static checks and production build
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10.10.0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint:ts
            - run: pnpm format:check
            - run: pnpm spellcheck
            - run: pnpm typecheck
            - run: pnpm build
            - run: pnpm test:animation:package-exports

    contracts:
        name: Contracts, platform, and fixtures
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10.10.0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm test:animation

    browser-matrix:
        name: Five fixtures on Chromium, Firefox, and WebKit
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10.10.0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @condev-monitor/animation-lab-runner exec playwright-core install --with-deps chromium firefox webkit
            - run: pnpm test:animation:browser-driver
            - run: pnpm test:animation:browser-integration
            - run: pnpm test:animation:browsers
              env:
                  CONDEV_ANIMATION_MATRIX_OUT_DIR: lab-results/ci-matrix
            - name: Upload Lab matrix evidence
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: animation-lab-browser-matrix
                  path: lab-results/ci-matrix
                  if-no-files-found: warn
                  retention-days: 14
